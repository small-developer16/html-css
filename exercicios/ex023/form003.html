<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        input[type="number"]{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" required autocomplete="name" id="inome" maxlength="30" placeholder="Nome completo">
        </p>
        <p>
            <label for="imdedia">Média</label>
            <input type="number" id="imedia" name="media"  required max="10" min="0" step="0.1" placeholder="0 à 10">
        </p>
        <p>
            <label for="imes">Período Letivo
            <input  id="imes" name="mes" type="month"  required value="2026-01">
            </label>
        </p>
        <p>
            <label for="itime">
                Horário da prova
                <input type="time" id="itime" name="time" required value="20:00">
            </label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
