<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs: color, range e file</title>
    <style>
        div{
            margin:16px;
        }
        
    </style>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <div>
            <label for="cor">
                Defina uma cor:
                <input type="color" id="cor" name="cor" value="#2b5f4a" >
            </label>
        </div>
        <div>
            <label for="nivel">
                Satisfação:
                <input type="range" id="nivel" name="nivel" step="1" min="0" max="10" value="0">
            </label>
        </div>
        <div>
            <label for="arquivo">
                Mande seu comprovante:
                <input type="file" id="arquivo" name="arquivo" value="" accept=".jpg, .pdf" >
            </label>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
