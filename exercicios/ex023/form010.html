<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário: </title>
    <style>
        div{
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on" >
        <div >
            <label for="ano">
                Em que ano você nasceu?:
                <input type="number" id="ano" name="Ano" min="1900" max="2026" oninput="calcIdade()">
            </label>
        </div>
        <div>
            <label for="idade">
                Você tem :
                <output id="idade">
                    0 anos
                </output>
            </label>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(ano.value) + String(' anos')
        }
    </script>
</body>
</html>
