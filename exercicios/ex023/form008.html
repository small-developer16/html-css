<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com JS</title>
    <style>
        div{
            margin: 16px 0 ;
        }
    </style>
</head>
<body>
    <form action="https://www.youtube.com" autocomplete="on" method="get">
        <div>
            <label for="n1">
                Número 1:
                <input type="number" value="" name="n1" id="n1" min="0" max="50" required  oninput="soma.innerHTML = Number(n1.value) / Number(n2.value)">
            </label>
        </div>
        <div>
            <label for="n2">
                Número 2:
                <input type="number"  value="" name="n2" id="n2" min="0" max="50" required oninput="soma.innerHTML = Number(n1.value) / Number(n2.value)">
            </label>
        </div>
        <div>
            <label for="soma">
                Soma:
            </label>
             <output id="soma"  name="soma">0</output>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
