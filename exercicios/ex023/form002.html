<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Inputs</title>
    <style>
        div{
            margin: 15px 0px;
        }
    </style>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post">
        <div>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" minlength="5" maxlength="15" size="25" autocomplete="username" placeholder="Nome do usuário" required>
        </div>
        <div>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" minlength="8" maxlength="20" autocomplete="current-password" placeholder="Sua Senha" required>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
